spring.application.name=mysteryBounty

# 기본 프로파일: 개발(dev)=H2, 운영(prod)=MySQL
spring.profiles.active=dev

# 지연 로딩 관련 뷰 렌더링 시점 트랜잭션 유지 비활성화 (권장 관례)
spring.jpa.open-in-view=false

# 관리자 기본 계정 (없을 때만 시드 생성, 이후 변경)
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.default-password=${APP_ADMIN_DEFAULT_PASSWORD:admin1234}

# CORS 허용 오리진 (콤마 구분, 프론트 도메인)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# 세션 유지 시간 — 대회 하루를 통째로 덮는다 (기본 30분이면 현황판을 오래 켜둔 사이 401 로 끊긴다)
server.servlet.session.timeout=${APP_SESSION_TIMEOUT:12h}
# 쿠키 수명도 같이 늘린다 — 브라우저를 닫았다 열어도 로그인이 유지된다
server.servlet.session.cookie.max-age=${APP_COOKIE_MAX_AGE:12h}

# 쿠키 보안 (HTTPS 전제). 프론트/백엔드 도메인 분리 배포면 none, 동일 사이트면 lax
server.servlet.session.cookie.same-site=${APP_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${APP_COOKIE_SECURE:false}
server.servlet.session.cookie.http-only=true
