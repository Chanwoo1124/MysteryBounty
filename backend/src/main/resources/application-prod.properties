# 운영 프로파일: MySQL (AWS/Docker). 접속 정보는 환경변수로 주입
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mysterybounty?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:mystery}
spring.datasource.password=${DB_PASSWORD:mystery}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# 운영은 HTTPS 전제 → Secure 쿠키 권장 (환경변수로 덮어씀)
