# 개발 프로파일: H2 파일 DB (별도 설치 불필요, ./data 폴더에 영구 저장)
spring.datasource.url=jdbc:h2:file:./data/mysterybounty;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 웹 콘솔 (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 개발은 HTTP 이므로 Secure 쿠키 끔
app.cookie-secure-note=dev-http
