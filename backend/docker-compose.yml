# 운영/배포 리허설용 MySQL. 개발은 H2(dev 프로파일)라 이 컨테이너 없이도 실행됨.
# 사용: docker compose up -d  후  ./gradlew bootRun --args='--spring.profiles.active=prod'
services:
  mysql:
    image: mysql:8.4
    container_name: mysterybounty-mysql
    environment:
      MYSQL_DATABASE: mysterybounty
      MYSQL_USER: mystery
      MYSQL_PASSWORD: mystery
      MYSQL_ROOT_PASSWORD: rootpw
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
